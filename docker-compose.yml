version: "3"

services:
  app:
    build: ./.docker-config/app
    ports:
      - ${APP_PORT}:4000
    command: mix phx.server
    volumes:
      - .:/workspace
      - node_modules:/workspace/assets/node_modules

  db:
    build: ./.docker-config/db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
      image: "redis:latest"
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data

  adminer:
    container_name: alternative-adminer
    hostname: adminer
    image: adminer:4.7.5
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - ./redisinsight:/db
    depends_on:
      - redis


volumes:
  node_modules:
  dbdata: null
  redis_data: null